{% load icons %}{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a class="btn btn-secondary btn-sm" href="{% querystring page=page_obj.previous_page_number %}">{% icon "arrow-left" %} Previous</a>
    {% endif %}
    <span class="current">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-secondary btn-sm" href="{% querystring page=page_obj.next_page_number %}">Next {% icon "arrow-right" %}</a>
    {% endif %}
  </nav>
{% endif %}
